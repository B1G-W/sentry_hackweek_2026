<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- magenta -> pink body gradient, matching the Seer mascot -->
    <linearGradient id="body" x1="50" y1="8" x2="50" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c81f97"/>
      <stop offset="0.55" stop-color="#d62a9d"/>
      <stop offset="1" stop-color="#e84bb0"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.42" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#3a2b6b"/>
      <stop offset="0.6" stop-color="#241a4d"/>
      <stop offset="1" stop-color="#140d2e"/>
    </radialGradient>
  </defs>

  <!-- Seer's triangular "all-seeing" head, rounded corners -->
  <path d="M50 9
           L88 78
           Q90.5 83 85 83
           L15 83
           Q9.5 83 12 78
           Z"
        fill="url(#body)"
        stroke="#f39ad6" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- almond eye -->
  <g>
    <path d="M27 52
             Q50 34 73 52
             Q50 70 27 52 Z"
          fill="#e9f0a8" stroke="#1c1140" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- iris + pupil -->
    <circle cx="50" cy="52" r="12.5" fill="url(#iris)"/>
    <circle cx="50" cy="52" r="6" fill="#0d0822"/>
    <!-- catchlights -->
    <circle cx="45.5" cy="47.5" r="3.1" fill="#ffffff"/>
    <circle cx="55" cy="55" r="1.4" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
